<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>타닥 가계부</title>
<meta name="description" content="계산기로 타닥타닥 입력하면 투명 바인더 포켓에서 돈이 빠져나가는 가계부. 기록은 내 기기에만 저장돼요.">
<meta name="theme-color" content="#F5F6F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="타닥 가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Gothic+A1:wght@400;500;700&family=Caveat:wght@500;700&family=DotGothic16&display=swap">
<style>
:root{
  --desk:#F5F6F9; --desk-2:#ECEEF3; --ink:#23252F; --ink-2:#646879; --ink-3:#A2A6B5; --line:#DFE2EA; --rule:#3A3D4A;
  --blob1:#DCE4FF; --blob2:#EFE3FF; --blob3:#DDF4EE;
  --case:rgba(255,255,255,.4); --case-2:rgba(255,255,255,.95); --stitch:rgba(255,255,255,.95); --zip:#C3C9D4;
  --sheet:rgba(255,255,255,.62); --sheet-edge:rgba(255,255,255,1); --sheet-shade:rgba(70,80,120,.07);
  --sleeve:rgba(255,255,255,.55); --sleeve-edge:rgba(255,255,255,1);
  --ring-a:#FDFDFE; --ring-b:#AEB5C2;
  --pink:#FFDCE6; --pink-ink:#B23E62; --mint:#D5F3E8; --mint-ink:#1F7A5B; --butter:#FFF1C4; --butter-ink:#8C6A00; --sky:#D9E4FF; --sky-ink:#3452A8; --lilac:#E7DEFF; --lilac-ink:#5A42A6; --peach:#FFE4D6; --peach-ink:#A24E26;
  --warn:#D0862A; --over:#D0506B; --ok:#1F7A5B;
  --c1:#FFDCE6; --c1i:#B23E62; --c2:#D5F3E8; --c2i:#1F7A5B; --c3:#D9E4FF; --c3i:#3452A8; --c4:#E7DEFF; --c4i:#5A42A6;
  --c5:#FFF1C4; --c5i:#8C6A00; --c6:#D6F1FA; --c6i:#1C6A86; --c7:#FFE4D6; --c7i:#A24E26; --c8:#E2F4D3; --c8i:#3F6B1F; --c9:#ECEEF3; --c9i:#555A68;
  --b10k:#E7DFCB; --b10k-ink:#6F6045; --b5k:#E0D9F2; --b5k-ink:#5B4F86; --b1k:#D6E3F6; --b1k-ink:#3D5F8C;
  --shadow:0 24px 50px -28px rgba(70,80,120,.45), 0 2px 6px rgba(70,80,120,.05);
  --hand:"Gaegu","Nanum Pen Script",cursive; --hand-en:"Caveat","Gaegu",cursive; --sans:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --lcd:"DotGothic16",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --desk:#15161B; --desk-2:#1D1F26; --ink:#EEEFF4; --ink-2:#B3B6C3; --ink-3:#7C8091; --line:#30333D; --rule:#8E92A2;
  --blob1:#1D2440; --blob2:#291F3C; --blob3:#15302A;
  --case:rgba(255,255,255,.05); --case-2:rgba(255,255,255,.14); --stitch:rgba(255,255,255,.12); --zip:#6E757E;
  --sheet:rgba(255,255,255,.07); --sheet-edge:rgba(255,255,255,.14); --sheet-shade:rgba(0,0,0,.3);
  --sleeve:rgba(255,255,255,.09); --sleeve-edge:rgba(255,255,255,.2);
  --ring-a:#D8DCE2; --ring-b:#6E757E;
  --pink:#5A2B3B; --pink-ink:#FFC2D3; --mint:#1E4739; --mint-ink:#A7E8D0; --butter:#4E4214; --butter-ink:#F5E08E; --sky:#23325C; --sky-ink:#C2D2FF; --lilac:#352C5C; --lilac-ink:#D9CEFF; --peach:#553222; --peach-ink:#FFD2BC;
  --warn:#EBA24A; --over:#F17C93; --ok:#8FD9BD;
  --c1:#5A2B3B; --c1i:#FFC2D3; --c2:#1E4739; --c2i:#A7E8D0; --c3:#23325C; --c3i:#C2D2FF; --c4:#352C5C; --c4i:#D9CEFF;
  --c5:#4E4214; --c5i:#F5E08E; --c6:#173F4D; --c6i:#B3E6F7; --c7:#553222; --c7i:#FFD2BC; --c8:#2C4220; --c8i:#CDEBB5; --c9:#33353E; --c9i:#D0D3DC;
  --b10k:#7E7358; --b10k-ink:#F4ECD8; --b5k:#645A86; --b5k-ink:#ECE6FA; --b1k:#4B6386; --b1k-ink:#DDE8F8;
  --shadow:0 24px 50px -24px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#15161B; --desk-2:#1D1F26; --ink:#EEEFF4; --ink-2:#B3B6C3; --ink-3:#7C8091; --line:#30333D; --rule:#8E92A2;
  --blob1:#1D2440; --blob2:#291F3C; --blob3:#15302A;
  --case:rgba(255,255,255,.05); --case-2:rgba(255,255,255,.14); --stitch:rgba(255,255,255,.12); --zip:#6E757E;
  --sheet:rgba(255,255,255,.07); --sheet-edge:rgba(255,255,255,.14); --sheet-shade:rgba(0,0,0,.3);
  --sleeve:rgba(255,255,255,.09); --sleeve-edge:rgba(255,255,255,.2);
  --ring-a:#D8DCE2; --ring-b:#6E757E;
  --pink:#5A2B3B; --pink-ink:#FFC2D3; --mint:#1E4739; --mint-ink:#A7E8D0; --butter:#4E4214; --butter-ink:#F5E08E; --sky:#23325C; --sky-ink:#C2D2FF; --lilac:#352C5C; --lilac-ink:#D9CEFF; --peach:#553222; --peach-ink:#FFD2BC;
  --warn:#EBA24A; --over:#F17C93; --ok:#8FD9BD;
  --c1:#5A2B3B; --c1i:#FFC2D3; --c2:#1E4739; --c2i:#A7E8D0; --c3:#23325C; --c3i:#C2D2FF; --c4:#352C5C; --c4i:#D9CEFF;
  --c5:#4E4214; --c5i:#F5E08E; --c6:#173F4D; --c6i:#B3E6F7; --c7:#553222; --c7i:#FFD2BC; --c8:#2C4220; --c8i:#CDEBB5; --c9:#33353E; --c9i:#D0D3DC;
  --b10k:#7E7358; --b10k-ink:#F4ECD8; --b5k:#645A86; --b5k-ink:#ECE6FA; --b1k:#4B6386; --b1k-ink:#DDE8F8;
  --shadow:0 24px 50px -24px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:radial-gradient(640px 460px at 0% 0%,var(--blob1),transparent 70%),radial-gradient(560px 520px at 88% 100%,var(--blob2),transparent 70%),radial-gradient(420px 340px at 100% 18%,var(--blob3),transparent 70%),var(--desk);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky-ink);outline-offset:2px}
.hand{font-family:var(--hand)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───── 상단 ───── */
.top{max-width:1260px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:18px 14px}
.brand{font-family:var(--hand);font-size:30px;font-weight:700;letter-spacing:.5px;line-height:1;display:flex;align-items:center;gap:10px}
.brand .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint-ink);opacity:.8}
.brand .dot.off{background:var(--over)} .brand .dot.wait{background:var(--ink-3)}
.pill{display:flex;align-items:center;gap:2px;background:var(--sheet);border:1px solid var(--sheet-edge);border-radius:999px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 14px -8px var(--sheet-shade)}
.pill button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--ink-2);font-size:13px}
.pill button[aria-pressed="true"]{background:var(--ink);color:var(--desk)}
.pnav{margin-left:auto}
.pnav button{width:32px;height:32px;padding:0;font-size:16px}
.pnav .plabel{text-align:center;line-height:1.05;padding:0 8px;min-width:120px}
.pnav .plabel b{display:block;font-family:var(--hand);font-size:22px;font-weight:700}
.pnav .plabel span{font-size:10.5px;color:var(--ink-3);letter-spacing:.5px}
.undo{border:1px solid var(--sheet-edge);background:var(--sheet);border-radius:999px;padding:7px 13px;color:var(--ink-2);font-size:12.5px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.undo:disabled{opacity:.4;cursor:default}
.banner{max-width:1260px;margin:0 auto 12px;padding:9px 14px;border-radius:12px;background:var(--butter);color:var(--butter-ink);font-size:13px}

/* PC: 다이어리 | 입력 카드 | 계산기 를 한 줄로 · 중간 폭: 다이어리 아래에 입력 카드와 계산기 · 폰: 다이어리 → 입력 카드 → 계산기 */
.layout{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 232px 262px;grid-template-areas:"diary slip calc";gap:20px;align-items:start;padding-bottom:56px}
.layout > *{min-width:0}
.binder-area{grid-area:diary} .slip{grid-area:slip} .calc-wrap{grid-area:calc}
@media (max-width:1099px){ .layout{grid-template-columns:minmax(0,1fr) minmax(0,300px);grid-template-areas:"diary diary" "slip calc";gap:18px} }
@media (max-width:720px){ .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"diary" "slip" "calc";gap:16px} }
.top,.banner{max-width:1480px}

/* ───── 계산기 (오른쪽 고정) ───── */
.calc-wrap,.slip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.calc-wrap{padding-top:10px;display:grid;gap:12px}
@media (max-width:1099px){ .calc-wrap,.slip{position:static} }
@media (max-width:720px){ .calc-wrap{max-width:380px;width:100%;margin:0 auto} }
.calc{--body:#FBF8F4; --body-edge:#EFE6DC; --screen:#3B3A3E; --screen-ink:#F1ECE4; --kt:#7A4B3B;
  --k1:#F9EDE6; --k2:#F5DCCF; --k3:#EFC7B5; --k4:#E7B09A; --k5:#DC977E; --keq:#E39B83; --lips:#E0473F;
  position:relative;background:var(--body);border-radius:30px;padding:48px 16px 18px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9), inset 0 -6px 0 var(--body-edge), var(--shadow)}
.calc[data-skin="sky"]{--body:#F8FAFC; --body-edge:#E2E8EF; --kt:#3F5B7B; --k1:#EAF2FA; --k2:#D8E6F5; --k3:#C3D8EF; --k4:#ADC8E8; --k5:#97B7DF; --keq:#94B4DD; --lips:#6FA6DB}
.buddy{position:absolute;top:-14px;left:24px;width:58px;height:40px;pointer-events:none;z-index:4}
.buddy .eye{position:absolute;top:0;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.12)}
.buddy .eye:nth-child(1){left:2px} .buddy .eye:nth-child(2){left:27px}
.buddy .eye i{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#1E1E22;transition:transform .08s}
.buddy .eye i::after{content:"";position:absolute;left:2px;top:2px;width:3.5px;height:3.5px;border-radius:50%;background:#fff}
.buddy .lips{position:absolute;left:9px;top:23px;width:40px;height:14px;border-radius:50%/60%;background:var(--lips);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.calc[data-skin="clear"] .buddy{display:none}
.nub,.screw{display:none}
.screen{position:relative;z-index:1;background:var(--screen);border-radius:12px;padding:10px 14px 8px;text-align:right;min-height:82px;box-shadow:inset 0 3px 10px rgba(0,0,0,.28);overflow:hidden}
.screen .expr{position:relative;font-family:var(--lcd);font-size:12px;color:var(--screen-ink);opacity:.55;min-height:17px;word-break:break-all}
.screen .val{position:relative;font-family:var(--lcd);font-size:31px;color:var(--screen-ink);line-height:1.15;letter-spacing:1px;white-space:nowrap}
.screen .cur{font-size:15px;opacity:.6;margin-right:5px}
.screen .mode{position:absolute;left:12px;top:8px;font-family:var(--lcd);font-size:10.5px;color:var(--screen-ink);opacity:.6;letter-spacing:1px}
.keys{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.key{--kc:var(--k3);position:relative;aspect-ratio:1;border-radius:50%;border:0;padding:0;font-family:var(--sans);font-size:17px;color:var(--kt);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 42%),var(--kc);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.07), inset 0 2px 0 rgba(255,255,255,.7), 0 4px 0 color-mix(in srgb,var(--kc) 70%,#000 12%), 0 7px 12px rgba(58,57,64,.16);
  transition:transform .06s ease, box-shadow .06s ease;touch-action:manipulation;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center}
.key > span{position:relative;z-index:2}
.key:active,.key.hit{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.07), inset 0 2px 0 rgba(255,255,255,.6), 0 1px 0 color-mix(in srgb,var(--kc) 70%,#000 12%), 0 2px 5px rgba(58,57,64,.14)}
.key.r1{--kc:var(--k1)} .key.r2{--kc:var(--k2)} .key.r3{--kc:var(--k3)} .key.r4{--kc:var(--k4)} .key.r5{--kc:var(--k5)}
.key.fn{font-size:13px;letter-spacing:.5px}
.key.tall{grid-row:span 2;aspect-ratio:auto;border-radius:999px}
.key.eq{--kc:var(--keq);color:#fff;font-size:21px}
.calc .brandmark{position:relative;z-index:1;margin-top:12px;text-align:center;font-family:var(--hand-en);font-size:14px;color:var(--kt);opacity:.55;letter-spacing:2px}

/* 투명 아크릴 (기본) — 두께·광택·안이 비치는 스위치 */
.calc[data-skin="clear"]{--screen:#CCD5CF; --screen-ink:#2F3833; --kt:#586070;
  border-radius:34px;padding:40px 18px 20px;border:1px solid rgba(255,255,255,1);
  background:linear-gradient(150deg,rgba(255,255,255,.82) 0%,rgba(255,255,255,.34) 38%,rgba(226,233,243,.46) 100%);
  box-shadow:inset 0 0 0 7px rgba(255,255,255,.34), inset 0 0 0 8px rgba(176,188,206,.32), inset 0 3px 0 9px rgba(255,255,255,.45), inset 0 -16px 26px -8px rgba(150,164,188,.3),
    0 1px 0 #fff, 0 11px 0 -2px rgba(222,227,236,.95), 0 12px 0 -1px rgba(176,186,204,.55), 0 38px 50px -24px rgba(60,72,110,.5);
  backdrop-filter:blur(7px) saturate(1.15);-webkit-backdrop-filter:blur(7px) saturate(1.15)}
.calc[data-skin="clear"]::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:linear-gradient(118deg,transparent 16%,rgba(255,255,255,.5) 22%,transparent 29%,transparent 63%,rgba(255,255,255,.3) 67%,transparent 71%)}
.calc[data-skin="clear"] .nub{display:block;position:absolute;top:-7px;width:34px;height:11px;border-radius:6px 6px 2px 2px;border:1px solid #fff;
  background:linear-gradient(to bottom,rgba(255,255,255,.9),rgba(222,229,239,.6));box-shadow:0 2px 0 rgba(176,186,204,.45)}
.calc[data-skin="clear"] .nub.l{left:24%} .calc[data-skin="clear"] .nub.r{right:24%}
.calc[data-skin="clear"] .screw{display:block;position:absolute;width:9px;height:9px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 40% 35%,#fff,#C4CBD6 70%);box-shadow:inset 0 0 0 1px rgba(150,160,178,.5)}
.calc[data-skin="clear"] .screw::after{content:"";position:absolute;left:2px;right:2px;top:4px;height:1px;background:rgba(120,130,150,.6);transform:rotate(35deg)}
.screw.s1{left:15px;top:15px} .screw.s2{right:15px;top:15px} .screw.s3{left:15px;bottom:15px} .screw.s4{right:15px;bottom:15px}
.calc[data-skin="clear"] .screen{border:5px solid rgba(255,255,255,.6);border-radius:12px;background:linear-gradient(to bottom,#C6D0C9,#D6DED8);
  box-shadow:inset 0 3px 7px rgba(40,50,45,.22), 0 0 0 1px rgba(168,178,196,.55), 0 2px 0 rgba(255,255,255,.8)}
.calc[data-skin="clear"] .key{border-radius:12px;border:1px solid rgba(255,255,255,.98);color:var(--kt);font-size:17px;
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.28) 55%,rgba(220,228,240,.5));
  box-shadow:inset 0 1px 0 #fff, inset 0 -4px 0 rgba(200,208,222,.35), 0 4px 0 rgba(176,186,204,.5), 0 8px 12px -4px rgba(60,72,110,.2)}
.calc[data-skin="clear"] .key.fn{font-size:13px}
.calc[data-skin="clear"] .key.eq{color:var(--sky-ink);background:linear-gradient(160deg,rgba(236,241,255,.95),rgba(217,228,255,.55) 55%,rgba(200,214,250,.6))}
.calc[data-skin="clear"] .key:active,.calc[data-skin="clear"] .key.hit{transform:translateY(3px);
  box-shadow:inset 0 1px 0 #fff, inset 0 -2px 0 rgba(200,208,222,.3), 0 1px 0 rgba(176,186,204,.5), 0 3px 6px -2px rgba(60,72,110,.2)}
.calc[data-skin="clear"] .brandmark{color:var(--ink-2)}
:root[data-theme="dark"] .calc[data-skin="clear"]{--kt:#D5DAE4;background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 40%,rgba(160,175,205,.1));border-color:rgba(255,255,255,.25);box-shadow:inset 0 0 0 7px rgba(255,255,255,.05), inset 0 0 0 8px rgba(255,255,255,.1), 0 11px 0 -2px rgba(255,255,255,.06), 0 38px 50px -24px rgba(0,0,0,.8)}
:root[data-theme="dark"] .calc[data-skin="clear"] .key{border-color:rgba(255,255,255,.28);background:linear-gradient(to bottom,rgba(255,255,255,.2),rgba(255,255,255,.05) 45%,rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 5px 0 rgba(255,255,255,.08), 0 9px 12px -3px rgba(0,0,0,.5)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .calc[data-skin="clear"]{--kt:#D5DAE4;background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 40%,rgba(160,175,205,.1));border-color:rgba(255,255,255,.25);box-shadow:inset 0 0 0 7px rgba(255,255,255,.05), inset 0 0 0 8px rgba(255,255,255,.1), 0 11px 0 -2px rgba(255,255,255,.06), 0 38px 50px -24px rgba(0,0,0,.8)}
  :root:not([data-theme="light"]) .calc[data-skin="clear"] .key{border-color:rgba(255,255,255,.28);background:linear-gradient(to bottom,rgba(255,255,255,.2),rgba(255,255,255,.05) 45%,rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 5px 0 rgba(255,255,255,.08), 0 9px 12px -3px rgba(0,0,0,.5)}
}

/* 입력 카드 */
.slip{margin-top:10px;background:var(--sheet);border:1px solid var(--sheet-edge);border-radius:20px;padding:13px;display:grid;gap:9px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 26px -16px rgba(70,80,120,.35)}
.seg{display:flex;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1px solid var(--sheet-edge);background:var(--sheet);border-radius:999px;padding:5px 2px;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid transparent;background:var(--cb,var(--c9));color:var(--ci,var(--c9i));border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap;line-height:1.55}
.chips .chip{opacity:.55;transition:opacity .15s, transform .15s}
.chips .chip[aria-pressed="true"]{opacity:1;border-color:var(--ci);transform:translateY(-1px)}
.frow{display:flex;gap:6px;align-items:center}
.frow > *{min-width:0}
.field{flex:1;height:34px;border:1px solid var(--sheet-edge);background:var(--sheet);border-radius:10px;padding:0 9px;font-size:13px}

@media (max-width:720px){
  /* 폰: 앱처럼 — 상단은 달 이동만, 아래에 고정 탭바 */

  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--sheet-edge);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}

  .tabbar button i{font-style:normal;font-size:20px;line-height:1.1}
  .tabbar button[aria-pressed="true"]{color:var(--ink)}
  .tabbar .rec-btn i{display:grid;place-items:center;width:44px;height:30px;border-radius:999px;background:var(--ink);color:var(--desk);font-size:17px}
  .tabbar .rec-btn{color:var(--ink)}
  .tab{padding:10px 14px 16px;font-size:16px}
  .case{padding:14px 10px 26px}
  .page{padding:16px 14px 40px}
  .pocket{height:200px}
  .tagline small{display:none}
  .more{display:block}
  /* 입력 카드: 짧고 크게 */
  .slip{gap:10px;padding:14px}
  .slip .seg button{padding:9px 2px;font-size:14px}
  #catChips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding:2px 14px}
  #catChips::-webkit-scrollbar{display:none}
  #catChips .chip{padding:7px 14px;font-size:14px;flex:none}
  .field,.slip input,.edit input,.edit select,textarea.field{font-size:16px;height:42px}
  .lab{font-size:17px;min-width:36px}
  .check{font-size:14px}
  .calc{padding:40px 16px 18px}
  .keys{gap:9px;margin-top:12px}
  .key{font-size:20px;aspect-ratio:1.35}
  .screen{min-height:70px}
  .calc .brandmark{display:none}
  .go{height:54px;font-size:15.5px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body:not([data-view="diary"]) .slip, body:not([data-view="diary"]) .calc-wrap{display:none}
}

/* ───── 바인더 (지퍼 케이스) ───── */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 18px;margin-bottom:-8px;position:relative;z-index:2;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--sheet-edge);border-bottom:0;background:color-mix(in srgb,var(--cb,var(--sheet)) 78%,transparent);color:var(--ci,var(--ink-2));border-radius:12px 12px 0 0;padding:7px 13px 15px;font-family:var(--hand);font-size:17px;font-weight:700;line-height:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transform:translateY(6px);transition:transform .18s;display:flex;align-items:baseline;gap:6px}
.tab small{font-family:var(--sans);font-size:10.5px;font-weight:400;opacity:.8}
.tab:hover{transform:translateY(2px)}
.tab[aria-selected="true"]{transform:translateY(-2px);box-shadow:0 -4px 10px -6px rgba(58,57,64,.3)}
.case{position:relative;background:var(--case);border-radius:30px;padding:24px 22px 34px;box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.8);border:1px solid var(--case-2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.case::before{content:"";position:absolute;inset:9px;border:1.5px solid var(--stitch);border-radius:23px;pointer-events:none}
.case .zip{position:absolute;right:46px;bottom:-12px;width:16px;height:42px;border-radius:8px;background:linear-gradient(90deg,var(--ring-b),var(--ring-a) 45%,var(--ring-b));box-shadow:0 2px 4px rgba(0,0,0,.2)}
.case .zip::after{content:"";position:absolute;left:50%;top:30px;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:3px solid var(--ring-b)}
.spread{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:stretch}
.rings{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;padding:30px 0;position:relative;z-index:3}
.rings i{width:44px;height:15px;border-radius:9px;background:linear-gradient(to bottom,var(--ring-a),var(--ring-b) 55%,var(--ring-a));box-shadow:0 2px 3px rgba(0,0,0,.22), inset 0 -1px 0 rgba(0,0,0,.15)}
.page{position:relative;background:var(--sheet);border:1px solid var(--sheet-edge);border-radius:12px;padding:22px 22px 44px;min-height:560px;backdrop-filter:blur(10px) saturate(1.05);-webkit-backdrop-filter:blur(10px) saturate(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 2px 6px var(--sheet-shade)}
.page.left{margin-right:-8px} .page.right{margin-left:-8px}
.page .punch{position:absolute;top:0;bottom:0;width:10px;display:flex;flex-direction:column;justify-content:space-evenly;padding:30px 0}
.page.left .punch{right:6px} .page.right .punch{left:6px}
.page .punch i{width:9px;height:9px;border-radius:50%;background:var(--desk-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.binder-area{container-type:inline-size;container-name:binder}
.page{container-type:inline-size;container-name:page}
@container binder (max-width:640px){
  .case{padding:18px 12px 30px;border-radius:24px}
  .case::before{inset:6px;border-radius:19px}
  .spread{grid-template-columns:minmax(0,1fr)}
  .rings{display:none}
  .page.left,.page.right{margin:0;min-height:0}
  .page + .rings + .page{margin-top:12px}
  .page{padding:18px 16px 22px}
}
.week{text-align:center;font-family:var(--hand);font-size:15px;letter-spacing:5px;color:var(--ink-2)}
.week b{display:inline-block;border:1.5px solid var(--ink-2);border-radius:50%;width:20px;height:20px;line-height:17px;letter-spacing:0;font-weight:400;text-align:center}
.doodle{position:absolute;pointer-events:none;color:var(--ink-2);opacity:.7}
.clip{position:absolute;top:-10px;left:26px;width:18px;height:52px;pointer-events:none}
.sticker{position:absolute;font-size:26px;pointer-events:none;user-select:none;transform:rotate(var(--r,-8deg))}
.oval{display:inline-block;font-family:var(--hand);font-size:19px;font-weight:700;color:var(--ci,var(--pink-ink));padding:1px 18px 2px;border:1.6px solid var(--ci,var(--pink-ink));background:color-mix(in srgb,var(--cb,var(--pink)) 85%,transparent);border-radius:52% 48% 50% 50%/60% 55% 45% 40%;transform:rotate(-2deg)}
.tagline{font-family:var(--hand);font-size:19px;line-height:1.1;margin-top:6px}

.foot{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--hand);font-size:14px;color:var(--ink-3);letter-spacing:.5px}

/* 포켓 (반투명 슬리브 + 지폐) */
.pocket{position:relative;height:250px;margin:22px 0 6px}
.bills{position:absolute;z-index:1;left:0;right:0;top:0;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pocket:hover .bills{transform:translateY(-10px)}
.bill{position:absolute;left:50%;top:30px;width:min(88%,300px);aspect-ratio:2.05;margin-left:calc(min(88%,300px) / -2);border-radius:6px;background:var(--bc);color:var(--bi);box-shadow:0 1px 2px rgba(0,0,0,.12), inset 0 0 0 5px color-mix(in srgb,var(--bc) 70%,#fff 30%);overflow:hidden;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg))}
.bill::before{content:"";position:absolute;right:12%;top:18%;width:30%;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--bc) 80%,#fff 20%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bi) 20%,transparent)}
.bill::after{content:"";position:absolute;left:8%;right:8%;bottom:14%;height:2px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--bi) 25%,transparent) 0 6px,transparent 6px 10px)}
.bill b{position:absolute;left:8%;top:12%;font-family:var(--sans);font-size:clamp(18px,4vw,26px);letter-spacing:1px}
.bill span{position:absolute;left:8%;top:44%;font-size:10px;letter-spacing:2px;opacity:.7}
.bill.v10000{--bc:var(--b10k);--bi:var(--b10k-ink)} .bill.v5000{--bc:var(--b5k);--bi:var(--b5k-ink)} .bill.v1000{--bc:var(--b1k);--bi:var(--b1k-ink)}
.bill.drop{animation:drop .7s cubic-bezier(.25,.9,.3,1.15) both;animation-delay:var(--d,0s)}
@keyframes drop{0%{transform:translate(var(--x,0),-190px) rotate(calc(var(--r,0deg) - 14deg));opacity:0}55%{opacity:1}100%{transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg));opacity:1}}
.bill.leave{animation:leave .75s cubic-bezier(.5,0,.7,.4) both;animation-delay:var(--d,0s)}
@keyframes leave{0%{transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg));opacity:1}100%{transform:translate(calc(var(--x,0) + 40px),-230px) rotate(calc(var(--r,0deg) + 16deg));opacity:0}}
.sleeve{position:absolute;z-index:2;left:0;right:0;bottom:0;height:70%;border-radius:8px 8px 16px 16px;background:var(--sleeve);border:1px solid var(--sleeve-edge);backdrop-filter:blur(3px) saturate(.95);-webkit-backdrop-filter:blur(3px) saturate(.95);
  -webkit-mask:radial-gradient(circle 26px at 50% 0,transparent 25px,#000 26px);mask:radial-gradient(circle 26px at 50% 0,transparent 25px,#000 26px);box-shadow:inset 0 2px 0 rgba(255,255,255,.7);padding:34px 18px 14px;display:flex;flex-direction:column;justify-content:flex-end}
.sleeve .amt{font-family:var(--hand);font-size:40px;font-weight:700;line-height:1;letter-spacing:.5px}
.sleeve .amt.neg{color:var(--over)}
.sleeve .amt small{font-size:22px;margin-right:2px;color:var(--ink-2)}
.sleeve .cap{font-family:var(--hand);font-size:16px;color:var(--ink-2)}
.count{position:absolute;right:14px;top:6px;z-index:3;font-family:var(--hand);font-size:15px;background:var(--desk);color:var(--ink-2);border-radius:999px;padding:0 8px;border:1px solid var(--line)}
.brk{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-family:var(--hand);font-size:18px;margin-top:10px}
.brk .v{text-align:right}
.note{font-size:12.5px;color:var(--ink-3)}

/* 게이지 */
.gauge{display:grid;gap:4px;margin-top:12px}
.gauge .bar{height:12px;border-radius:999px;background:var(--sheet);border:1px solid var(--sheet-edge);overflow:hidden;position:relative}
.gauge .bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--mint-ink);opacity:.85;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge.warn .bar i{background:var(--warn)} .gauge.over .bar i{background:var(--over)}
.gauge .meta{display:flex;justify-content:space-between;font-family:var(--hand);font-size:16px;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.gauge.ok .state{color:var(--ok)} .gauge.warn .state{color:var(--warn)} .gauge.over .state{color:var(--over)}

/* 기록 (ref3 줄 노트) */
.cols{display:grid;grid-template-columns:118px 46px minmax(0,1fr) auto;gap:8px;font-family:var(--hand);font-size:14px;color:var(--ink-3);line-height:1.1;margin-top:16px;padding:0 2px 4px}
.recs{border-top:1.4px solid var(--rule)}
.rec{display:grid;grid-template-columns:118px 46px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;min-height:44px;padding:6px 2px;border:0;border-bottom:1.4px solid var(--rule);background:none;text-align:left;border-radius:0;transition:background .15s}
.rec:hover{background:color-mix(in srgb,var(--sheet) 70%,transparent)}
.rec .rd{font-family:var(--hand);font-size:15px;letter-spacing:.3px;white-space:nowrap}
.rec .rd.same{opacity:.35}
.rec .rd b{font-weight:400;font-size:12.5px;margin-left:2px}
.rec .rd b.sun{color:var(--over)} .rec .rd b.sat{color:var(--sky-ink)}
.rec .rp{display:grid;gap:2px}
.rec .rp i{font-style:normal;width:17px;height:17px;border-radius:50%;border:1.2px solid var(--ink-3);font-size:9.5px;line-height:15px;text-align:center;color:var(--ink-3);position:relative}
.rec .rp i.on{border-color:var(--ink);color:var(--ink)}
.rec .rp i.on::after{content:"✓";position:absolute;left:2px;top:-7px;font-size:15px;color:var(--pink-ink);font-weight:700}
.rec .rm{font-family:var(--hand);font-size:19px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .rm .chip{font-family:var(--sans);font-size:10.5px;padding:0 7px;margin-right:6px;vertical-align:3px}
.rec .ra{font-family:var(--hand);font-size:19px;font-weight:700;white-space:nowrap}
.rec .ra.plus{color:var(--ok)}
.rec.dim .rm,.rec.dim .ra{color:var(--ink-3)}
.tag{font-family:var(--sans);font-size:10px;padding:0 6px;border-radius:5px;margin-left:6px;vertical-align:3px;background:var(--butter);color:var(--butter-ink)}
.tag.grey{background:var(--c9);color:var(--c9i)}
.empty{padding:40px 8px;text-align:center;color:var(--ink-3);font-family:var(--hand);font-size:21px;line-height:1.35}
@container page (max-width:430px){
  .cols{display:none}
  .rec{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"m a" "d p";row-gap:0;padding:8px 2px}

.edit{margin:8px 0 12px;padding:14px;border-radius:14px;background:var(--desk);border:1px solid var(--line);display:grid;gap:8px;box-shadow:0 10px 24px -16px rgba(58,57,64,.5)}

.btn.danger{color:var(--over)}
.btn.danger.armed{background:var(--over);color:#fff;border-color:var(--over)}

/* 요약 */
.h{font-family:var(--hand);font-size:30px;font-weight:700;line-height:1;margin:14px 0 2px}
.sub{font-family:var(--hand);font-size:16px;color:var(--ink-3)}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.memo-card{position:relative;background:color-mix(in srgb,var(--cb) 70%,transparent);color:var(--ci);border-radius:4px 14px 6px 12px;padding:16px 14px 12px;transform:rotate(var(--r,0deg));box-shadow:0 6px 14px -10px rgba(58,57,64,.5)}
.memo-card::before{content:"";position:absolute;top:-8px;left:50%;width:54px;height:16px;margin-left:-27px;background:color-mix(in srgb,var(--desk) 55%,transparent);border:1px solid var(--sheet-edge);transform:rotate(-3deg);backdrop-filter:blur(2px)}
.memo-card .k{font-family:var(--hand);font-size:16px;opacity:.85}
.memo-card .v{font-family:var(--hand);font-size:28px;font-weight:700;line-height:1.1}
.memo-card .d{font-size:11.5px;opacity:.85;margin-top:2px}
.up{color:var(--over)} .down{color:var(--ok)}
.section{margin-top:22px}
.section h3{font-family:var(--hand);font-size:23px;margin:0 0 8px;font-weight:700}
.cattable{width:100%;border-collapse:collapse}
.cattable td{padding:7px 3px;border-bottom:1.2px solid var(--rule);vertical-align:middle;font-family:var(--hand);font-size:17px}
.cattable .bar{height:9px;border-radius:999px;background:var(--line);min-width:40px;position:relative;overflow:hidden}
.cattable .bar i{position:absolute;inset:0 auto 0 0;background:var(--ci);border-radius:999px;opacity:.8}
.cattable .r{text-align:right;white-space:nowrap}
.cattable .chip{font-family:var(--sans);font-size:11px}
.chartwrap{overflow-x:auto}
.chart text{fill:var(--ink-3);font-size:12px;font-family:var(--hand)}

.chart .bl{fill:var(--sky)} .chart .bf{fill:var(--pink)}

/* 설정 */
.set-card{display:grid;gap:10px;padding:14px 0;border-bottom:1.2px dashed var(--line)}
.set-card:last-child{border-bottom:0}
.set-card h3{margin:0;font-family:var(--hand);font-size:23px}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skins button{border:1.5px solid var(--line);background:var(--sheet);border-radius:16px;padding:10px 6px 8px;display:grid;gap:6px;justify-items:center;font-size:12.5px;color:var(--ink-2)}
.skins button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.skins .sw{display:flex;gap:3px}

.flybill{position:fixed;left:0;top:0;z-index:60;width:96px;aspect-ratio:2.05;border-radius:4px;pointer-events:none;background:var(--bc);color:var(--bi);box-shadow:0 6px 14px rgba(0,0,0,.18), inset 0 0 0 3px color-mix(in srgb,var(--bc) 70%,#fff 30%);font-size:13px;display:flex;align-items:center;padding-left:10px;letter-spacing:1px}
.week,.cols,.foot,.tagline small,.rec .rd{font-family:var(--hand-en)}

@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} .pocket:hover .bills{transform:none} }
/* 공개판 추가: 원화 지폐, 첫 실행, 백업 알림 */

<script>
(() => {
"use strict";
// ---------- 기본값 ----------
const DEFAULT_CATS = [
  {id:"food",name:"식비",order:0},{id:"household",name:"생활용품",order:1},{id:"transport",name:"교통비",order:2},
  {id:"rent",name:"월세",order:3},{id:"utilities",name:"공과금·통신",order:4},{id:"medical",name:"의료",order:5},
  {id:"leisure",name:"여가·선물",order:6},{id:"travel",name:"여행",order:7},{id:"other",name:"기타",order:8}];
const DEFAULT_SETTINGS = {currency:"JPY",holidayRule:"jp",cycleStartDay:25,foodGoal:40000,foodCategoryId:"food",calcSkin:"clear",sound:{enabled:true,preset:"thock",volume:0.7}};
const STICKERS = ["🍀","🐥","🌷","🍓","☁️","🎀","🧸","🌼","🐰","🫧"];
const TYPES = [["expense","지출"],["income","수입"],["saving","저축"],["investment","투자"],["transfer","이체"]];
const TYPE_NAME = Object.fromEntries(TYPES);
const DOW = ["일","월","화","수","목","금","토"], DOW_EN = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const SKINS = [["clear","클리어 아크릴",["#FFFFFF","#E3E8F0","#CCD5CF"]],["peach","피치",["#F9EDE6","#EFC7B5","#DC977E"]],["sky","스카이",["#EAF2FA","#C3D8EF","#97B7DF"]]];

// ---------- 상태 ----------
const S = {
  docs:{}, db:null, dbState:"loading",
  view:"diary", period:null, page:"salary",
  type:"expense", cat:"food", pay:null, expr:"", editing:null, armedDelete:null,
  undo:[], catDelete:null, importData:null, anim:null, periodOverride:null,
};
const store = { get:(k)=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CUR = () => (settings().currency === "KRW" ? "₩" : "¥");
const yen = (n) => (n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const clone = (o) => o == null ? o : JSON.parse(JSON.stringify(o));
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const newId = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrow = () => matchMedia("(max-width:720px)").matches;

// ---------- 설정·카테고리 ----------
const settings = () => ({...DEFAULT_SETTINGS, ...(S.docs["meta/settings"]||{}), sound:{...DEFAULT_SETTINGS.sound, ...((S.docs["meta/settings"]||{}).sound||{})}});
const cats = () => ((S.docs["meta/categories"]||{}).items || DEFAULT_CATS).slice().sort((a,b)=>a.order-b.order);
const catById = (id) => cats().find(c => c.id === id);
const catIndex = (id) => { const i = cats().findIndex(c => c.id === id); return i < 0 ? 8 : i % 9; };
const catStyle = (id) => { const i = catIndex(id) + 1; return `--cb:var(--c${i});--ci:var(--c${i}i)`; };
const catName = (id) => catById(id)?.name || "(삭제된 분류)";

// ---------- 일본 공휴일 · 급여 주기 ----------
function nthMonday(y, m, n) { const d = new Date(y, m-1, 1); const off = (8 - d.getDay()) % 7; return 1 + off + (n-1)*7; }
function baseHoliday(d) {
  const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  if (["1-1","2-11","2-23","4-29","5-3","5-4","5-5","8-11","11-3","11-23"].includes(`${m}-${day}`)) return true;
  if (m===1 && day===nthMonday(y,1,2)) return true;
  if (m===7 && day===nthMonday(y,7,3)) return true;
  if (m===9 && day===nthMonday(y,9,3)) return true;
  if (m===10 && day===nthMonday(y,10,2)) return true;
  const k = y - 1980, leap = Math.floor(k/4);
  if (m===3 && day===Math.floor(20.8431 + 0.242194*k - leap)) return true;
  if (m===9 && day===Math.floor(23.2488 + 0.242194*k - leap)) return true;
  return false;
}
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
function isHoliday(d) {
  if (baseHoliday(d)) return true;
  if (d.getDay() !== 0) {
    for (let k = 1; k < 7; k++) { const p = addDays(d, -k); if (!baseHoliday(p)) break; if (p.getDay() === 0) return true; } // 대체휴일
    if (baseHoliday(addDays(d,-1)) && baseHoliday(addDays(d,1))) return true; // 국민의 휴일
  }
  return false;
}
const pkey = (y, m) => `${y}-${pad(m)}`;
function periodOf(d) {
  if (d.getDate() >= settings().cycleStartDay) return pkey(d.getFullYear(), d.getMonth()+1);
  const p = new Date(d.getFullYear(), d.getMonth(), 0); return pkey(p.getFullYear(), p.getMonth()+1);
}
function payday(y, m) { const rule = settings().holidayRule; let d = new Date(y, m-1, settings().cycleStartDay); if (rule === "none") return d; while (d.getDay()===0 || d.getDay()===6 || (rule === "jp" && isHoliday(d))) d = addDays(d,-1); return d; }
function incomePeriodOf(d) { return d >= payday(d.getFullYear(), d.getMonth()+1) ? pkey(d.getFullYear(), d.getMonth()+1) : periodOf(d); }
function shiftKey(k, n) { const [y,m] = k.split("-").map(Number); const d = new Date(y, m-1+n, 1); return pkey(d.getFullYear(), d.getMonth()+1); }
function periodTitle(k) { const [y,m] = k.split("-").map(Number); return `${y}년 ${m}월분`; }
function periodShort(k) { const [y,m] = k.split("-").map(Number); return `${y}.${pad(m)}`; }
function periodRange(k) { const [y,m] = k.split("-").map(Number); const s = settings().cycleStartDay; const e = new Date(y, m, s-1); return `${m}.${s} – ${e.getMonth()+1}.${e.getDate()}`; }

// ---------- 데이터 파생 ----------
const periodDoc = (k) => S.docs["periods/"+k] || {key:k, note:"", entries:[]};
const entriesOf = (k) => periodDoc(k).entries || [];
const periodKeys = () => Object.keys(S.docs).filter(p => p.startsWith("periods/")).map(p => p.slice(8)).sort();
function totals(k) {
  const t = {income:0, living:0, special:0, saving:0, investment:0, transfer:0, food:0, byCat:{}};
  const food = settings().foodCategoryId;
  for (const e of entriesOf(k)) {
    if (e.type === "expense") {
      if (e.isSpecial) t.special += e.amount;
      else { t.living += e.amount; t.byCat[e.category] = (t.byCat[e.category]||0) + e.amount; if (e.category === food) t.food += e.amount; }
    } else if (t[e.type] !== undefined) t[e.type] += e.amount;
  }
  t.remain = t.income - t.living - t.special - t.saving - t.investment;
  return t;
}
function cumulative(type, upto) { let s = 0; for (const k of periodKeys()) if (k <= upto) for (const e of entriesOf(k)) if (e.type === type) s += e.amount; return s; }

// ---------- 저장 (이 기기의 브라우저) ----------
const LS_DOCS = "tadak-gagebu:docs", LS_META = "tadak-gagebu:meta";
const local = { meta:{} };
function readLS(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return undefined; } }
let saveTimer = null;
function writeDoc() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_DOCS, JSON.stringify(S.docs)); }
    catch (e) { setBanner("이 브라우저에 저장하지 못했어요. 저장 공간이 부족하거나 저장이 막혀 있어요. 설정 → 백업에서 백업 파일을 꼭 저장해 두세요."); }
    autoBackupSoon(); checkNudge();
  }, 120);
}
function saveMeta() { try { localStorage.setItem(LS_META, JSON.stringify(local.meta)); } catch (e) {} }
function commit(changes, label, opts = {}) {
  const prev = {};
  for (const p of Object.keys(changes)) prev[p] = clone(S.docs[p] ?? null);
  if (!opts.noUndo) { S.undo.push({prev, label}); if (S.undo.length > 100) S.undo.shift(); }
  for (const [p, d] of Object.entries(changes)) { if (d == null) delete S.docs[p]; else S.docs[p] = d; writeDoc(p, d); }
  render();
  if (label && !opts.quiet) toast(label, !opts.noUndo);
}
function undo() {
  const u = S.undo.pop(); if (!u) return;
  for (const [p, d] of Object.entries(u.prev)) { if (d == null) delete S.docs[p]; else S.docs[p] = d; writeDoc(p, d); }
  S.editing = null; render(); toast("되돌렸어요: " + u.label, false);
}
async function connect() {
  const docs = readLS(LS_DOCS);

function pocket({amount, billAmount, cap, style, id}) {

  const anim = S.anim && S.anim.page === id && !reduced() ? Math.min(shown.length, billsFor(S.anim.amount, 4).shown.length) : 0;

    return `<div class="bill ${settings().currency === "KRW" ? "krw" : "jpy"}-${v}${isNew ? " " + kind : ""}" style="--x:${x};--y:${y};--r:${r};--d:${delay}s;z-index:${i}"><b>${v.toLocaleString("ja-JP")}</b><span>${settings().currency === "KRW" ? "BANK OF KOREA" : "NIPPON GINKO"}</span></div>`;
  }).join("");

    <div class="sleeve"><div class="amt ${amount<0?"neg":""}"><small>${CUR()}</small>${yen(amount)}</div><div class="cap">${cap}</div></div></div>`;
}

function trendChart(cur) {
  const keys = []; for (let i = 11; i >= 0; i--) keys.push(shiftKey(cur, -i));
  const data = keys.map(k => ({k, ...totals(k)}));
  const max = Math.max(10000, ...data.map(d => d.living));
  const step = [10000,20000,50000,100000,200000,500000].find(s => max/s <= 5) || 1000000, top = Math.ceil(max/step)*step;
  const W = 520, H = 230, L = 40, R = 6, T = 24, B = 34, bw = (W-L-R)/keys.length;
  const y = v => T + (H-T-B) * (1 - v/top);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=10000?(v/10000)+"만":v}</text>`;
  data.forEach((d,i) => {
    const x = L + i*bw + bw*0.16, w = bw*0.68, [yy,mm] = d.k.split("-");
    g += `<g class="${d.k===cur?"cur":""}">`;
    if (d.living) g += `<rect class="bl" x="${x}" y="${y(d.living)}" width="${w}" height="${y(0)-y(d.living)}" rx="4"/>`;
    if (d.food) g += `<rect class="bf" x="${x+w*0.22}" y="${y(d.food)}" width="${w*0.56}" height="${y(0)-y(d.food)}" rx="3"/>`;
    if (d.special) g += `<text class="sp" x="${x+w/2}" y="${(d.living?y(d.living):y(0))-6}" text-anchor="middle">★${d.special>=10000?Math.round(d.special/10000)+"만":yen(d.special)}</text>`;
    g += `<text x="${x+w/2}" y="${H-16}" text-anchor="middle" ${d.k===cur?'style="fill:var(--ink)"':""}>${Number(mm)}월</text>`;
    if (i===0 || mm==="01") g += `<text x="${x+w/2}" y="${H-2}" text-anchor="middle">${yy}</text>`;
    g += `<rect class="hit" data-pk="${d.k}" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T}"><title>${periodTitle(d.k)} · 생활비 ${CUR()}${yen(d.living)} · 식비 ${CUR()}${yen(d.food)}${d.special?` · 특별지출 ${CUR()}${yen(d.special)}`:""}</title></rect></g>`;
  });
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="최근 12개월 생활비와 식비">${g}</svg></div>
    <div class="legend"><span><i style="background:var(--sky)"></i>생활비</span><span><i style="background:var(--pink)"></i>식비</span><span><b style="color:var(--butter-ink)">★</b> 특별지출 (막대에 안 넣음)</span></div>
    <div class="chartcap" id="chartCap">막대를 누르면 그 달로 가요</div>`;
}

function allEntries() { return periodKeys().flatMap(k => entriesOf(k).map(e => ({...e, periodKey:k}))).sort((a,b) => a.date.localeCompare(b.date)); }
function download(filename, data, type) {
  const err = $("bkErr"); if (err) err.hidden = true;
  try {
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { if (err) { err.textContent = "파일을 저장하지 못했어요. 다른 브라우저에서 다시 시도해 주세요."; err.hidden = false; } return false; }
}
function exportCsv() {
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const head = ["날짜","주기","종류","분류","특별지출","메모","금액","결제","원본표기","출처"];
  const lines = allEntries().map(e => [e.date, e.periodKey, TYPE_NAME[e.type], e.category?catName(e.category):"", e.isSpecial?"Y":"", e.memo, e.amount, e.payment==="cash"?"현금":e.payment==="card"?"카드":"", e.original, e.source].map(q).join(","));
  download(`tadak-gagebu-${iso(new Date())}.csv`, "\uFEFF" + [head.join(","), ...lines].join("\n"), "text/csv");
}
function backupJson() {
  return JSON.stringify({app:"tadak-gagebu", version:1, exportedAt:new Date().toISOString(), categories:cats(), settings:settings(), entries:allEntries(),
    periods:periodKeys().map(k => ({key:k, note:periodDoc(k).note||""})).filter(p => p.note)}, null, 1);
}
function exportJson() {
  if (download(`tadak-gagebu-${iso(new Date())}.json`, backupJson(), "application/json")) { markBackedUp(); toast("백업 파일을 저장했어요", false); render(); }
}
function readImport(file) {
  const err = $("bkErr"); if (err) err.hidden = true;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!Array.isArray(j.entries)) throw new Error("entries");
      const byKey = {};
      for (const e of j.entries) {
        if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !(Number(e.amount) > 0) || !TYPE_NAME[e.type]) throw new Error("entry");
        const k = e.periodKey || (e.type === "income" ? incomePeriodOf(parseISO(e.date)) : periodOf(parseISO(e.date)));
        (byKey[k] = byKey[k] || []).push({...e, amount:Math.round(Number(e.amount)), periodKey:k, id:e.id || newId()});
      }
      S.importData = {entries:j.entries, byKey, notes:Object.fromEntries((j.periods||[]).map(p => [p.key, p.note||""])), categories:j.categories, settings:j.settings};
      render();
    } catch (e) { if (err) { err.textContent = "가져올 수 없는 파일이에요. 이 앱에서 저장한 백업 파일(.json)을 골라 주세요."; err.hidden = false; } else toast("가져올 수 없는 파일이에요", false); }
  };
  r.readAsText(file);
}
function applyImport() {
  const im = S.importData; if (!im) return;
  const changes = {}, keys = new Set([...Object.keys(im.byKey), ...Object.keys(im.notes)]);
  for (const k of periodKeys()) if (!keys.has(k)) changes["periods/"+k] = null;
  for (const k of keys) changes["periods/"+k] = {key:k, note:im.notes[k]||"", entries:im.byKey[k]||[]};
  if (Array.isArray(im.categories) && im.categories.length) changes["meta/categories"] = {items:im.categories};
  if (im.settings) changes["meta/settings"] = {...DEFAULT_SETTINGS, ...im.settings};
  S.importData = null; S.firstRun = false;
  commit(changes, `${im.entries.length}건을 가져왔어요`);
}

  $("tabs").onclick = e => { const b = e.target.closest(".tab[data-p]"); if (!b) return; S.page = b.dataset.p; S.editing = null; S.showAll = false; render(); };

    if (form) {
      if (e.target.closest("[data-close]")) { S.editing = null; render(); }
      else if (e.target.closest("[data-del]")) { if (S.armedDelete === form.dataset.form) deleteEntry(form.dataset.form, form.dataset.k); else { S.armedDelete = form.dataset.form; render(); } }
      return;
    }
    const bar = e.target.closest("[data-pk]"); if (bar) { S.period = bar.dataset.pk; render(); return; }
    if (S.view === "settings") settingsClick(e);
  });
  sp.addEventListener("submit", e => { const f = e.target.closest("form.edit"); if (f) { e.preventDefault(); saveEdit(f); } });
  sp.addEventListener("change", e => {
    const f = e.target.closest("form.edit");
    if (f) { if (e.target.name === "type") { const c = f.querySelector("[name=category]"), s = f.querySelector("[name=isSpecial]"); c.disabled = s.disabled = e.target.value !== "expense"; } return; }
    if (S.view === "settings") settingsChange(e);
  });
  sp.addEventListener("focusout", e => {
    if (e.target.id !== "noteBox") return;
    const k = S.period, v = e.target.value.trim(); if (v === (periodDoc(k).note||"")) return;
    const doc = clone(periodDoc(k)); doc.key = k; doc.note = v; doc.entries = doc.entries || [];
    commit({["periods/"+k]: doc}, "특이사항을 저장했어요");
  });
  sp.addEventListener("mouseover", e => { const r = e.target.closest("[data-pk]"), cap = $("chartCap"); if (r && cap) cap.textContent = r.querySelector("title").textContent; });
  $("onboard").addEventListener("click", welcomeClick);
  $("onboard").addEventListener("change", e => { if (e.target.id === "wDay") { S.welcome.day = Number(e.target.value); render(); } });
  $("onboard").addEventListener("input", e => { if (e.target.id === "wGoal") S.welcome.goal = e.target.value; });
  $("nudgeGo").onclick = () => exportJson();
  $("nudgeLater").onclick = () => { local.meta.snoozeUntil = Date.now() + 3 * 864e5; saveMeta(); checkNudge(); };
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installPrompt = e; if (S.view === "settings") render(); });
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
  $("importFile").onchange = e => { const f = e.target.files[0]; if (f) readImport(f); e.target.value = ""; };
  document.addEventListener("keydown", e => {
    const tg = e.target instanceof Element ? e.target : document.body;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !tg.closest("input,textarea")) { e.preventDefault(); undo(); return; }
    if (tg.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Enter") { if (tg.closest("button")) return; e.preventDefault(); if (hasOp()) { flashKey("="); pressKey("="); } else submitEntry(); return; }
    const map = {"+":"+","-":"−","*":"×","x":"×","/":"÷","Backspace":"⌫","Escape":"AC","=":"="};
    const k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if (!k) return;
    e.preventDefault(); flashKey(k); pressKey(k);
  });
}
function welcomeClick(e) {
  const b = e.target.closest("button"); if (!b) return;
  const w = S.welcome;
  if (b.dataset.w) {
    const k = b.dataset.w, v = b.dataset.v;
    if (k === "mute") w.sound = false;
    else if (k === "preset") { w.preset = v; w.sound = true; S.welcomeSound = v; }
    else w[k] = v;
    if (k === "currency") { w.goal = v === "KRW" ? "400000" : "40000"; if (v === "KRW" && w.rule === "jp") w.rule = "weekend"; }
    if (k === "preset" || k === "skin") playPreview(w);
    render(); return;
  }
  if (b.dataset.cat) { const id = b.dataset.cat; if (id === "food") return; w.cats = w.cats.includes(id) ? w.cats.filter(x => x !== id) : [...w.cats, id]; render(); return; }
  if (b.id === "wAddCat") {
    const name = $("wNewCat").value.trim(); if (!name) return;
    if (![...DEFAULT_CATS, ...w.extra].some(c => c.name === name)) { const id = "c" + Date.now().toString(36); w.extra.push({id, name}); w.cats.push(id); }
    render(); return;
  }
  if (b.id === "impJson") return $("importFile").click();
  if (b.id === "impGo") return applyImport();
  if (b.id === "impX") { S.importData = null; render(); return; }
  if (b.id === "wStart") {
    const raw = String(w.goal).replace(/[,\s]/g, ""), goal = raw === "" ? 0 : Math.round(Number(raw));
    if (Number.isNaN(goal) || goal < 0) { $("wErr").textContent = "목표는 숫자로 적거나 비워 두세요."; $("wErr").hidden = false; return; }
    const items = [...DEFAULT_CATS, ...w.extra].filter(c => w.cats.includes(c.id)).map((c, i) => ({id:c.id, name:c.name, order:i}));
    S.firstRun = false;
    commit({
      "meta/settings": {...DEFAULT_SETTINGS, currency:w.currency, cycleStartDay:w.day, holidayRule:w.rule, foodGoal:goal, calcSkin:w.skin,
        sound:{...DEFAULT_SETTINGS.sound, enabled:w.sound !== false, preset:w.preset}},
      "meta/categories": {items},
    }, "준비 끝! 첫 월급부터 넣어 보세요", {noUndo:true});
    S.period = periodOf(new Date()); S.type = "income"; S.view = "diary"; S.page = "salary"; askPersist(); render();
    scrollTo({top:0});
  }
}
// 온보딩에서는 아직 설정이 저장되기 전이라, 고른 소리로 바로 들려준다
function playPreview(w) {
  const keep = S.docs["meta/settings"];
  S.docs["meta/settings"] = {...DEFAULT_SETTINGS, sound:{...DEFAULT_SETTINGS.sound, enabled:true, preset:w.preset}};
  click(w.preset);
  if (keep) S.docs["meta/settings"] = keep; else delete S.docs["meta/settings"];
}
function settingsChange(e) {
  const id = e.target.id;
  if (id === "sDay") { saveSettings({cycleStartDay:Number(e.target.value)}, `월급날을 ${e.target.value}일로 바꿨어요`); S.period = periodOf(new Date()); render(); return; }
  if (id === "sRule") { saveSettings({holidayRule:e.target.value}, "월급날 규칙을 바꿨어요"); return; }
  if (id === "sGoal") { const v = Math.round(Number(String(e.target.value).replace(/[,\s]/g,""))); if (!(v > 0)) { $("goalErr").textContent = "목표는 1 이상의 숫자로 적어 주세요."; $("goalErr").hidden = false; return; } saveSettings({foodGoal:v}, "식비 목표를 바꿨어요"); }
  else if (id === "sFoodCat") saveSettings({foodCategoryId:e.target.value}, "목표 분류를 바꿨어요");
  else if (id === "sSound") saveSettings({sound:{...settings().sound, enabled:e.target.checked}});
  else if (id === "sVol") { saveSettings({sound:{...settings().sound, volume:Number(e.target.value)/100}}); click(); }
  else if (e.target.dataset.rename) {
    const name = e.target.value.trim(), errEl = $("catErr");
    if (!name) { errEl.textContent = "이름을 비워 둘 수 없어요."; errEl.hidden = false; e.target.value = catName(e.target.dataset.rename); return; }
    saveCats(cats().map(c => c.id === e.target.dataset.rename ? {...c, name} : c), `'${name}'(으)로 이름을 바꿨어요`);
  }
}
function settingsClick(e) {
  const b = e.target.closest("button"); if (!b) return;
  if (b.closest("#sCur")) { saveSettings({currency:b.dataset.v}, b.dataset.v === "KRW" ? "원(₩)으로 바꿨어요" : "엔(¥)으로 바꿨어요"); return; }
  if (b.id === "persist") { askPersist().then(ok => { toast(ok ? "저장소 보호를 켰어요" : "이 브라우저는 저장소 보호를 허용하지 않았어요. 홈 화면에 추가하면 켜질 수 있어요", false); render(); }); return; }
  if (b.id === "autoOn") return connectAutoBackup();
  if (b.id === "autoRe") return reconnectAutoBackup();
  if (b.id === "autoOff") return disconnectAutoBackup();
  if (b.id === "install" && S.installPrompt) { S.installPrompt.prompt(); S.installPrompt = null; return; }
  if (b.closest("#sSkin")) { saveSettings({calcSkin:b.dataset.v}, "계산기 스킨을 바꿨어요"); click(); }
  else if (b.closest("#sPreset")) { saveSettings({sound:{...settings().sound, preset:b.dataset.v}}); click(b.dataset.v); }
  else if (b.dataset.up) { const cs = cats(), i = cs.findIndex(c => c.id === b.dataset.up); if (i > 0) { [cs[i-1], cs[i]] = [cs[i], cs[i-1]]; saveCats(cs.map((c,j) => ({...c, order:j})), "순서를 바꿨어요"); } }
  else if (b.dataset.cdel) { if (cats().length <= 1) { $("catErr").textContent = "분류가 하나는 있어야 해요."; $("catErr").hidden = false; return; } S.catDelete = b.dataset.cdel; render(); }
  else if (b.hasAttribute("data-cdelx")) { S.catDelete = null; render(); }
  else if (b.dataset.cdelgo) {
    const from = b.dataset.cdelgo, to = $("moveTo").value, extra = {};
    for (const k of periodKeys()) { const d = periodDoc(k); if (d.entries.some(x => x.category === from)) { const nd = clone(d); nd.entries = nd.entries.map(x => x.category === from ? {...x, category:to} : x); extra["periods/"+k] = nd; } }
    const name = catName(from); S.catDelete = null;
    const items = cats().filter(c => c.id !== from).map((c,j) => ({...c, order:j}));
    if (settings().foodCategoryId === from) extra["meta/settings"] = {...clone(S.docs["meta/settings"]||DEFAULT_SETTINGS), foodCategoryId:to};
    saveCats(items, `'${name}'을(를) 지우고 기록을 '${catName(to)}'(으)로 옮겼어요`, extra);
  }
  else if (b.id === "addCat") {
    const name = $("newCat").value.trim(), errEl = $("catErr");
    if (!name) { errEl.textContent = "새 분류 이름을 적어 주세요."; errEl.hidden = false; return; }
    if (cats().some(c => c.name === name)) { errEl.textContent = "같은 이름의 분류가 이미 있어요."; errEl.hidden = false; return; }
    saveCats([...cats(), {id:"c"+Date.now().toString(36), name, order:cats().length}], `'${name}' 분류를 만들었어요`);
  }
  else if (b.id === "expCsv") exportCsv();
  else if (b.id === "expJson") exportJson();
  else if (b.id === "impJson") $("importFile").click();
  else if (b.id === "impGo") applyImport();
  else if (b.id === "impX") { S.importData = null; render(); }
}

// ---------- 시작 ----------
const v = store.get("gagebu.view"); if (v === "summary" || v === "diary") S.view = v;
bind(); render(); connect();
})();
</script>
</body>
